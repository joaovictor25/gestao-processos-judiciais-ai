spring.application.name=backend

app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=gestao-processos
app.jwt.validade=PT1H
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.jpa.open-in-view=false

app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.datajud.api-key=${DATAJUD_API_KEY:}
app.djen.connect-timeout-ms=${DJEN_CONNECT_TIMEOUT_MS:10000}
app.djen.read-timeout-ms=${DJEN_READ_TIMEOUT_MS:55000}

spring.h2.console.enabled=false
spring.flyway.enabled=false

# Coordenação DataJud compartilhada pelo banco: uma consulta em voo, com espaçamento mínimo.
app.datajud.intervalo-ms=${DATAJUD_INTERVALO_MS:1500}
app.datajud.pausa-429-ms=${DATAJUD_PAUSA_429_MS:30000}
app.datajud.retry-base-ms=${DATAJUD_RETRY_BASE_MS:5000}
app.datajud.max-tentativas=${DATAJUD_MAX_TENTATIVAS:3}
app.datajud.prazo-geracao-ms=${DATAJUD_PRAZO_GERACAO_MS:300000}
app.datajud.cache-ms=${DATAJUD_CACHE_MS:300000}
app.datajud.cache-max-entradas=${DATAJUD_CACHE_MAX_ENTRADAS:200}
app.datajud.fila-max=${DATAJUD_FILA_MAX:100}
app.datajud.fila-por-usuario=${DATAJUD_FILA_POR_USUARIO:5}
app.datajud.worker-enabled=${DATAJUD_WORKER_ENABLED:true}
app.datajud.worker-intervalo-ms=${DATAJUD_WORKER_INTERVALO_MS:1000}

# Protecao contra abuso (memoria local da instancia). Janelas em ISO-8601, ex.: PT1M, PT15M, PT1H.
app.auth.limite.login-por-ip=${AUTH_LOGIN_POR_IP:20}
app.auth.limite.login-janela=${AUTH_LOGIN_JANELA:PT1M}
app.auth.limite.falhas-por-email=${AUTH_FALHAS_POR_EMAIL:10}
app.auth.limite.falhas-janela=${AUTH_FALHAS_JANELA:PT15M}
app.auth.limite.cadastro-por-ip=${AUTH_CADASTRO_POR_IP:5}
app.auth.limite.cadastro-janela=${AUTH_CADASTRO_JANELA:PT1H}
app.auth.limite.max-chaves=${AUTH_LIMITE_MAX_CHAVES:100000}

# Cotas de chamadas ao Gemini: por usuario, globais da instancia e simultaneas.
app.ia.limite.por-usuario=${IA_LIMITE_POR_USUARIO:30}
app.ia.limite.janela-usuario=${IA_LIMITE_JANELA_USUARIO:PT1H}
app.ia.limite.global=${IA_LIMITE_GLOBAL:300}
app.ia.limite.janela-global=${IA_LIMITE_JANELA_GLOBAL:PT1H}
app.ia.limite.simultaneas=${IA_LIMITE_SIMULTANEAS:4}

spring.application.name=backend
spring.profiles.default=dev

app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=gestao-processos
app.jwt.validade=PT1H
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.jpa.open-in-view=false

app.gemini.api-key=${GEMINI_API_KEY:AQ.Ab8RN6JTrYTc78rXek0i8_zy9Y5j7t1a93RIMr2o7HSuHaSxWA}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
app.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

#Configura??o do Banco H2
spring.datasource.url=jdbc:h2:mem:banco
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.path=/h2
spring.h2.console.enabled=false
spring.jpa.defer-datasource-initialization=true

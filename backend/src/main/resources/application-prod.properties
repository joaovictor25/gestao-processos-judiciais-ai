# Segredos podem vir de variaveis de ambiente ou de arquivos com esses nomes em /run/secrets.
spring.config.import=optional:configtree:/run/secrets/

spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.datasource.hikari.maximum-pool-size=${MYSQL_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${MYSQL_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${MYSQL_CONNECTION_TIMEOUT_MS:30000}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.h2.console.enabled=false
app.jwt.secret=${JWT_SECRET}
app.datajud.api-key=${DATAJUD_API_KEY}
app.gemini.api-key=${GEMINI_API_KEY:}

server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

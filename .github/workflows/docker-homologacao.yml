name: Docker homologation

# Constroi as imagens e sobe a stack completa (Caddy, Nginx, Spring Boot, MySQL) com credenciais
# ficticias, banco descartavel e back-end sem saida para a internet. Nao realiza deploy.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homologacao:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run homologation
        run: bash deploy/scripts/homologacao.sh

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docker-homologacao-logs
          path: .homolog/stack.log
          if-no-files-found: ignore

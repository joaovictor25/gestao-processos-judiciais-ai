name: MySQL persistence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Check Docker and preload MySQL 8.4
        run: |
          docker info
          docker pull mysql:8.4

      - name: Run MySQL persistence tests
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=MySqlPersistenceIntegrationTests -Dsurefire.failIfNoSpecifiedTests=true test

      - name: Require all MySQL tests to execute
        run: |
          report="target/surefire-reports/TEST-br.com.axionweb.backend.persistence.MySqlPersistenceIntegrationTests.xml"
          test -f "$report"
          grep -q 'tests="5"' "$report"
          grep -q 'skipped="0"' "$report"
          grep -q 'failures="0"' "$report"
          grep -q 'errors="0"' "$report"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mysql-persistence-surefire
          path: backend/target/surefire-reports/
          if-no-files-found: error

# Servido atras do Caddy; HTTPS, compressao e cabecalhos de seguranca ficam no proxy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A API pertence ao back-end; se uma requisicao chegar aqui, nao devolve o index.html.
    location /api/ {
        return 404;
    }

    # Assets com hash no nome gerados pelo Vite: cache longo e imutavel. Arquivo ausente = 404.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # HTML sempre revalidado para que um novo deploy seja carregado imediatamente.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Fallback do React Router (BrowserRouter): rotas como /processos/10 recebem o index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
